# The players' releases (docs/decisions.md D18, D20, D21, D22): Windows builds ss-delta.exe without Qt,
# Linux builds ss-delta.x86_64 in the Steam Runtime (sniper) SDK, macOS builds ss-delta.arm64 with
# Apple's clang, and vita-recomp-kit's make-setup.py lays out each one: the game's own folder, with
# its importer in setup/. A release holds no game or firmware data: the first time it starts on the
# player's computer, it downloads the firmware from Sony (the compiler, zig, is in setup/toolchain: D32), and builds the game from the
# player's own dump, in its folder.
# A tag v* makes a draft release with the three archives and the APK, their SHA-256 and build attestations; a
# manual run only uploads them as workflow artifacts.
# Each archive carries recomplauncher.json (game.json release_files), with the version stamped into
# its prepare.version: RecompLauncher builds the game again from the player's dump after every update,
# as docs/INSTALLING.md asks of a player updating by hand.
#
# Time and stalls (#27): every job downloads what it needs first, in attempts of a few minutes
# (tools/ci-retry.py; the kit leaves a source slower than 256 KB/s for its next mirror), and keeps the
# downloads in the Actions cache until their lock files change. The compilers run through sccache
# (its GitHub Actions cache backend). The PC jobs build while the android job runs and wait for its APK
# (tools/ci-wait-job.py) only before laying out the setup. Every step that touches the network has a
# time limit of its own.
name: Setup release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'A manual run: all, or some of android, windows, linux, macos (comma-separated); the PC archives are made without the APK when android is left out'
        default: all

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: read  # tools/ci-wait-job.py reads the run's jobs

env:
  # sccache with the GitHub Actions cache; CMake takes the launchers from the environment (Vita3K's
  # CMakeLists.txt already builds MSVC objects with /Z7, which sccache can cache)
  SCCACHE_GHA_ENABLED: 'true'
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache

jobs:
  # The game's APK (docs/decisions.md D25, docs/09-android.md): lib ss-delta.so built with the NDK on
  # Linux, packed by Gradle. It goes into every PC archive (setup/android/ss-delta.apk), from where the
  # setup's --android step puts it on a device, and into the release by itself. Signed with the release
  # key from the repository's secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
  # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD): an installed APK can only be updated by one signed with the
  # same key. A tag needs the key; a manual run without it signs with a throwaway debug key.
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'android')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        timeout-minutes: 5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            third_party/vita3k/android/gradle/wrapper/gradle-wrapper.properties
            third_party/vita3k/vita3k/game-frontend/android/*.gradle
            third_party/vita3k/vita3k/game-frontend/android/*.gradle.kts

      # Vita3K's language catalog generator needs Python 3.12
      - uses: actions/setup-python@v6
        timeout-minutes: 5
        with:
          python-version: '3.12'

      # The device's build tools' downloads (python.org, ziglang.org or a mirror, PyPI;
      # android-build-tools.json), kept until the lock changes
      - id: tools-cache
        uses: actions/cache/restore@v6
        timeout-minutes: 5
        with:
          path: build/android/downloads
          key: android-build-tools-${{ hashFiles('third_party/recomp/tools/android-build-tools.json') }}

      - name: Download the build tools for the device
        timeout-minutes: 16
        run: |
          python -I tools/ci-retry.py --attempts 3 --minutes 5 -- python -I -c "import json, sys; sys.path.insert(0, sys.argv[1]); import toolchain; toolchain.download(json.load(open(sys.argv[2], encoding='utf-8')), sys.argv[3])" \
            third_party/recomp/tools third_party/recomp/tools/android-build-tools.json build/android/downloads

      - if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        timeout-minutes: 5
        with:
          path: build/android/downloads
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        timeout-minutes: 5

      - name: NDK r29, platform 35, build-tools 35, Ninja
        timeout-minutes: 15
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: ./.github/actions/vita3k-dependencies
        timeout-minutes: 10
        with:
          build: build/vita3k-android
          ffmpeg: ffmpeg-android-arm64.zip

      - name: Configure Android
        timeout-minutes: 31
        run: |
          python -I tools/ci-retry.py --attempts 3 --minutes 10 -- cmake -S third_party/vita3k -B build/vita3k-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=28 -DCMAKE_BUILD_TYPE=RelWithDebInfo -DVITA3K_GAMES_ONLY=ON \
            -DUSE_DISCORD_RICH_PRESENCE=OFF

      - name: Build libss-delta.so (NDK, games only)
        run: |
          cmake --build build/vita3k-android --target ss-delta
          sccache --show-stats
          # the game's library and libadrenotools' hooks beside it (add_game), without debug info
          mkdir -p build/android/jniLibs/arm64-v8a
          for f in build/vita3k-android/bin/*.so; do
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-debug -o "build/android/jniLibs/arm64-v8a/$(basename "$f")" "$f"
          done
          ls -la build/android/jniLibs/arm64-v8a

      # the tools the APK builds the game's modules with on the device (D27): python.org's Python,
      # capstone, PyYAML, zig for aarch64-linux and the kit, pinned in android-build-tools.json
      - name: The build tools for the device
        run: |
          python -I third_party/recomp/tools/android-build-tools.py third_party/recomp/tools/android-build-tools.json \
            build/android/buildtools --ndk "$NDK" --project . --cache build/android/downloads

      - uses: actions/cache@v6
        timeout-minutes: 5
        with:
          path: build/android/host-zig/downloads
          key: android-host-zig-${{ hashFiles('third_party/recomp/tools/toolchain-linux.json') }}

      - name: Test the Android AOT build
        timeout-minutes: 23
        run: |
          python -I tools/ci-retry.py --attempts 3 --minutes 5 -- python -I third_party/recomp/tools/toolchain.py fetch third_party/recomp/tools/toolchain-linux.json build/android/host-zig
          python -I tools/ci-retry.py --attempts 3 --minutes 2 -- python -m pip install --disable-pip-version-check capstone==5.0.7 PyYAML==6.0.3
          python -I third_party/recomp/recomp/tests/smoke_module.py --android build/android/host-zig

      - name: Pack and sign the APK
        timeout-minutes: 25
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then version="${{ github.ref_name }}"; else version="$(echo ${{ github.sha }} | cut -c1-7)"; fi
          # versionCode: v<major>.<minor>.<patch> as major*10000 + minor*100 + patch, else the run number
          code=$(echo "$version" | sed -nE 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\1 \2 \3/p' | awk '{ print $1 * 10000 + $2 * 100 + $3 }')
          code=${code:-${{ github.run_number }}}
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          elif [ "${{ github.ref_type }}" = tag ]; then
            echo "::error::no release key (secrets.ANDROID_KEYSTORE_BASE64): a release APK must be signed with it"; exit 1
          else
            echo "::warning::no release key: the APK is signed with a debug key and can't update a release's install"
          fi
          python -I tools/ci-retry.py --attempts 3 --minutes 8 -- \
            bash third_party/vita3k/android/gradlew -p third_party/vita3k/vita3k/game-frontend/android assembleRelease \
            --no-daemon --console=plain -Pgame=ss-delta -PapplicationId=io.github.vitarecomps.ssdelta -PappName=ss-delta \
            -PversionName="${version#v}" -PversionCode="$code" -PjniLibsDir="$PWD/build/android/jniLibs" \
            -PbuildToolsDir="$PWD/build/android/buildtools"
          name="ss-delta-$version-android.apk"
          mkdir -p build/release
          cp third_party/vita3k/vita3k/game-frontend/android/build/outputs/apk/release/game-frontend-release.apk "build/release/$name"
          (cd build/release && sha256sum "$name" > "$name.sha256")
          echo "APK=build/release/$name" >> "$GITHUB_ENV"

      - uses: actions/attest-build-provenance@v3
        timeout-minutes: 10
        with:
          subject-path: ${{ env.APK }}

      - uses: actions/upload-artifact@v7
        timeout-minutes: 10
        with:
          name: setup-android
          path: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256

  # The PC jobs don't wait for android to start: they build at once and wait for its APK just before
  # laying out the setup (ANDROID: whether this run makes one).
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'windows')
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      ANDROID: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'android') }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        timeout-minutes: 5
        with:
          python-version: '3.12'

      # the setup's downloads (python.org's embeddable Python and Tk, the wheels, zig), kept until the
      # lock files change
      - id: setup-cache
        uses: actions/cache/restore@v6
        timeout-minutes: 5
        with:
          path: build/release/setup-downloads
          key: setup-windows-${{ hashFiles('third_party/recomp/tools/setup-windows.json', 'third_party/recomp/tools/toolchain-windows.json') }}

      - name: Download the setup's files
        timeout-minutes: 16
        run: python -I tools/ci-retry.py --attempts 3 --minutes 5 -- python -I third_party/recomp/tools/make-setup.py download third_party/recomp/tools/setup-windows.json --out build/release/ss-delta

      - if: steps.setup-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        timeout-minutes: 5
        with:
          path: build/release/setup-downloads
          key: ${{ steps.setup-cache.outputs.cache-primary-key }}

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        timeout-minutes: 5

      - uses: ./.github/actions/vita3k-dependencies
        timeout-minutes: 10
        with:
          build: build/vita3k-games
          ffmpeg: ffmpeg-windows-x64.zip

      - name: Configure Windows
        timeout-minutes: 31
        run: python -I tools/ci-retry.py --attempts 3 --minutes 10 -- python -I third_party/recomp/tools/build-vita3k.py --games-only --configure-only --runtime-tests

      - name: Build ss-delta.exe (games only, no Qt)
        shell: pwsh
        run: |
          python -I third_party/recomp/tools/build-vita3k.py --games-only --target ss-delta cooperative_pause_tests kernel_pause_tests audio_pause_tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build/vita3k-games -C RelWithDebInfo -R '^(cooperative_pause|kernel_pause|audio_pause)$' --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          sccache --show-stats

      - name: Wait for the APK
        if: env.ANDROID == 'true'
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I tools/ci-wait-job.py android --minutes 85

      - uses: actions/download-artifact@v7
        if: env.ANDROID == 'true'
        timeout-minutes: 10
        with:
          name: setup-android
          path: build/apk

      - name: Lay out the setup
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '${{ github.sha }}'.Substring(0, 7) }
          $name = "ss-delta-$version-windows"
          python -I tools/stamp-recomplauncher.py recomplauncher.json $version
          $apk = @(Get-ChildItem build/apk/*.apk -ErrorAction SilentlyContinue | Select-Object -First 1 | ForEach-Object { '--apk', $_.FullName })
          python -I third_party/recomp/tools/make-setup.py build third_party/recomp/tools/setup-windows.json `
            --project . --bin build/vita3k-games/bin/RelWithDebInfo --out build/release/ss-delta @apk --zip --archive "build/release/$name"
          $zip = "build/release/$name.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/build/release/$name.zip.sha256", "$hash  $name.zip`n")  # LF, for sha256sum -c
          "ZIP=$zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Test the shipped Windows toolchain
        timeout-minutes: 8
        run: build/release/ss-delta/setup/python/python.exe -I third_party/recomp/recomp/tests/smoke_module.py build/release/ss-delta/setup/toolchain

      - uses: actions/attest-build-provenance@v3
        timeout-minutes: 10
        with:
          subject-path: ${{ env.ZIP }}

      - uses: actions/upload-artifact@v7
        timeout-minutes: 10
        with:
          name: setup-windows
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256

  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'linux')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # the SDK the Deck's Steam Runtime matches: glibc 2.31, g++ 14 (docs/07-linux.md)
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:3.0.20261021.266025
    env:
      ANDROID: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'android') }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          submodules: recursive

      - name: Python 3.12 (the setup's own, python-build-standalone; the SDK has 3.9)
        timeout-minutes: 10
        run: |
          read -r url sha <<EOF
          $(python3 -c "import json; f = next(f for f in json.load(open('third_party/recomp/tools/setup-linux.json'))['files'] if f['kind'] == 'python'); print(f['url'], f['sha256'])")
          EOF
          curl -sSfL --retry 3 --retry-all-errors --connect-timeout 30 --speed-limit 262144 --speed-time 30 --max-time 300 \
            -o /tmp/python.tar.gz "$url"
          echo "$sha  /tmp/python.tar.gz" | sha256sum -c -
          mkdir -p /opt/python && tar -xzf /tmp/python.tar.gz -C /opt/python --strip-components=1
          echo "PY=/opt/python/bin/python3" >> "$GITHUB_ENV"

      - id: setup-cache
        uses: actions/cache/restore@v6
        timeout-minutes: 5
        with:
          path: build/release/setup-downloads
          key: setup-linux-${{ hashFiles('third_party/recomp/tools/setup-linux.json', 'third_party/recomp/tools/toolchain-linux.json') }}

      - name: Download the setup's files
        timeout-minutes: 16
        run: $PY -I tools/ci-retry.py --attempts 3 --minutes 5 -- $PY -I third_party/recomp/tools/make-setup.py download third_party/recomp/tools/setup-linux.json --out build/release/ss-delta

      - if: steps.setup-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        timeout-minutes: 5
        with:
          path: build/release/setup-downloads
          key: ${{ steps.setup-cache.outputs.cache-primary-key }}

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        timeout-minutes: 5

      - uses: ./.github/actions/vita3k-dependencies
        timeout-minutes: 10
        with:
          build: build/vita3k-games
          ffmpeg: ffmpeg-linux-x64.zip

      - name: Configure Linux
        timeout-minutes: 31
        run: $PY -I tools/ci-retry.py --attempts 3 --minutes 10 -- $PY -I third_party/recomp/tools/build-vita3k.py --configure-only --runtime-tests

      - name: Build ss-delta.x86_64
        run: |
          $PY -I third_party/recomp/tools/build-vita3k.py --target ss-delta cooperative_pause_tests kernel_pause_tests audio_pause_tests
          ctest --test-dir build/vita3k-games -C RelWithDebInfo -R '^(cooperative_pause|kernel_pause|audio_pause)$' --output-on-failure
          sccache --show-stats

      - name: Wait for the APK
        if: env.ANDROID == 'true'
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
        run: $PY -I tools/ci-wait-job.py android --minutes 85

      - uses: actions/download-artifact@v7
        if: env.ANDROID == 'true'
        timeout-minutes: 10
        with:
          name: setup-android
          path: build/apk

      - name: Lay out the setup
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then version="${{ github.ref_name }}"; else version="$(echo ${{ github.sha }} | cut -c1-7)"; fi
          name="ss-delta-$version-linux"
          $PY -I tools/stamp-recomplauncher.py recomplauncher.json "$version"
          $PY -I third_party/recomp/tools/make-setup.py build third_party/recomp/tools/setup-linux.json \
            --project . --bin build/vita3k-games/bin/RelWithDebInfo --out build/release/ss-delta \
            $(ls build/apk/*.apk 2>/dev/null | head -1 | sed 's/^/--apk /') --zip --archive "build/release/$name"
          tgz="build/release/$name.tar.gz"
          (cd build/release && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "TGZ=$tgz" >> "$GITHUB_ENV"

      - name: Test the shipped Linux toolchain
        timeout-minutes: 8
        run: build/release/ss-delta/setup/python/bin/python3 -I third_party/recomp/recomp/tests/smoke_module.py build/release/ss-delta/setup/toolchain

      - uses: actions/attest-build-provenance@v3
        timeout-minutes: 10
        with:
          subject-path: ${{ env.TGZ }}

      - uses: actions/upload-artifact@v7
        timeout-minutes: 10
        with:
          name: setup-linux
          path: |
            ${{ env.TGZ }}
            ${{ env.TGZ }}.sha256

  macos:
    # Apple Silicon; the build targets macOS 13.3 (the fork's CMAKE_OSX_DEPLOYMENT_TARGET)
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'macos')
    runs-on: macos-15
    timeout-minutes: 120
    env:
      ANDROID: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'android') }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        timeout-minutes: 5
        with:
          python-version: '3.12'

      - id: setup-cache
        uses: actions/cache/restore@v6
        timeout-minutes: 5
        with:
          path: build/release/setup-downloads
          key: setup-macos-${{ hashFiles('third_party/recomp/tools/setup-macos.json', 'third_party/recomp/tools/toolchain-macos.json') }}

      - name: Download the setup's files
        timeout-minutes: 16
        run: python -I tools/ci-retry.py --attempts 3 --minutes 5 -- python -I third_party/recomp/tools/make-setup.py download third_party/recomp/tools/setup-macos.json --out build/release/ss-delta

      - if: steps.setup-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        timeout-minutes: 5
        with:
          path: build/release/setup-downloads
          key: ${{ steps.setup-cache.outputs.cache-primary-key }}

      # Ninja from PyPI, pinned (Homebrew updates itself first, which took minutes)
      - name: Ninja
        timeout-minutes: 7
        run: python -I tools/ci-retry.py --attempts 3 --minutes 2 -- python -m pip install --disable-pip-version-check ninja==1.13.2

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        timeout-minutes: 5

      - uses: ./.github/actions/vita3k-dependencies
        timeout-minutes: 10
        with:
          build: build/vita3k-games
          ffmpeg: ffmpeg-macos-arm64.zip

      - name: Configure macOS
        timeout-minutes: 31
        run: python -I tools/ci-retry.py --attempts 3 --minutes 10 -- python -I third_party/recomp/tools/build-vita3k.py --configure-only --runtime-tests

      - name: Build ss-delta.arm64
        run: |
          python -I third_party/recomp/tools/build-vita3k.py --target ss-delta cooperative_pause_tests kernel_pause_tests audio_pause_tests
          ctest --test-dir build/vita3k-games -C RelWithDebInfo -R '^(cooperative_pause|kernel_pause|audio_pause)$' --output-on-failure
          sccache --show-stats

      - name: Wait for the APK
        if: env.ANDROID == 'true'
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I tools/ci-wait-job.py android --minutes 85

      - uses: actions/download-artifact@v7
        if: env.ANDROID == 'true'
        timeout-minutes: 10
        with:
          name: setup-android
          path: build/apk

      - name: Lay out the setup
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then version="${{ github.ref_name }}"; else version="$(echo ${{ github.sha }} | cut -c1-7)"; fi
          name="ss-delta-$version-macos"
          python -I tools/stamp-recomplauncher.py recomplauncher.json "$version"
          python -I third_party/recomp/tools/make-setup.py build third_party/recomp/tools/setup-macos.json \
            --project . --bin build/vita3k-games/bin/RelWithDebInfo --out build/release/ss-delta \
            $(ls build/apk/*.apk 2>/dev/null | head -1 | sed 's/^/--apk /') --zip --archive "build/release/$name"
          tgz="build/release/$name.tar.gz"
          (cd build/release && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "TGZ=$tgz" >> "$GITHUB_ENV"

      - name: Test the shipped macOS toolchain
        timeout-minutes: 8
        run: build/release/ss-delta/setup/python/bin/python3 -I third_party/recomp/recomp/tests/smoke_module.py build/release/ss-delta/setup/toolchain

      - uses: actions/attest-build-provenance@v3
        timeout-minutes: 10
        with:
          subject-path: ${{ env.TGZ }}

      - uses: actions/upload-artifact@v7
        timeout-minutes: 10
        with:
          name: setup-macos
          path: |
            ${{ env.TGZ }}
            ${{ env.TGZ }}.sha256

  release:
    if: github.ref_type == 'tag'
    needs: [android, windows, linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # the release's notes: .github/release-notes/<tag>.md when there is one (written when the release
      # is prepared), else the short text below
      - uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          sparse-checkout: .github/release-notes

      - uses: actions/download-artifact@v7
        timeout-minutes: 10
        with:
          path: dist
          merge-multiple: true

      - name: Draft release
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${{ github.ref_name }}.md"
          if [ -f "$notes" ]; then
            set -- --notes-file "$notes"
          else
            set -- --notes "Unpack the archive for your system and start the game: Windows, ss-delta.exe in ss-delta-${{ github.ref_name }}-windows.zip; Linux and Steam Deck (desktop mode the first time), ss-delta.x86_64 in ss-delta-${{ github.ref_name }}-linux.tar.gz; macOS 13.3 or newer on Apple Silicon, the app in ss-delta-${{ github.ref_name }}-macos.tar.gz (macOS blocks it the first time: System Settings, Privacy & Security, Open Anyway). Android (64-bit ARM with Vulkan; made for Snapdragon handhelds such as the AYN Thor): install ss-delta-${{ github.ref_name }}-android.apk and start it; its setup screen builds the game on the device from your dump (a PC that has built the game can also put it on the device with --android). The first start builds the game from your own dump of Soul Sacrifice Delta (US PCSA00152 or EU PCSF00532, update 1.30); everything stays in its folder. README.txt explains. SHA-256 and the build attestations: see the files attached and 'gh attestation verify'."
          fi
          gh release create '${{ github.ref_name }}' dist/* --repo '${{ github.repository }}' --draft \
            --title 'ss-delta ${{ github.ref_name }}' "$@"
